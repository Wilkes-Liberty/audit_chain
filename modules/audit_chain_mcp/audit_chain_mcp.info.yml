name: 'Audit Chain MCP'
type: module
description: 'Optional Tool API plugins for chain status, window counts, export status and verify now, governed by MCP Sentinel.'
package: 'Security'
# Audit Chain declares ^10.6 || ^11.3 || ^12. MCP Sentinel does not declare
# Drupal 12 yet, so this submodule cannot either.
core_version_requirement: ^10.6 || ^11.3
dependencies:
  - audit_chain:audit_chain
  - mcp_sentinel:mcp_sentinel (>=2.22.0)
  - tool:tool (>=1.0.0-beta8)
