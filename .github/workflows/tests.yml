name: Tests

# Runs the PHPUnit suite on every PR and on push to 1.x.
#
# The matrix mirrors mcp_sentinel's, and for the same reason: the support floor
# is the oldest branch upstream still supports, not the one we happen to run —
# and a support claim CI does not exercise is not a claim. Per endoflife.date on
# 2026-07-28 the live core branches are 10.6 and 11.3 (both EOL 2026-12-16) and
# 11.4 (EOL 2027-07-07), so the floors are 10.6 and 11.3, plus the ceiling.
# Drupal 12 is declared on the base module but is not a matrix leg: Key and
# Encrypt have not declared ^12, so that install cannot resolve.
#
# `constraint` is spelled out per leg rather than derived from `drupal`: ^11.3
# means ">=11.3 <12" and resolves to 11.4, so a leg built that way silently
# retests the ceiling. A floor leg pins its minor (~11.3.0); the ceiling floats.
#
# RFC 3161 (DEV-1010) uses PHP's openssl extension so a host that loads
# the OpenSSL 3 FIPS provider gets validated crypto. The dedicated
# `PHPUnit (OpenSSL 3 FIPS provider)` job builds OpenSSL 3.0 with
# enable-fips, activates that provider as the default, and runs the
# RFC 3161 kernel tests plus the witness suite. Its guard step must be
# able to fail: MD5 through PHP openssl, or a missing fips provider,
# fails the job. Algorithm-floor tests reject SHA-1 independently of
# that provider.
#
# phpunit is pinned per leg because Drupal 10's core-dev hard-requires ^9.6,
# which predates PHP 8 attributes — it ignores an attribute it cannot read
# rather than erroring. That is why the suite carries annotations alongside its
# attributes, and why both legs must report the same test count.
#
# Note on injection safety: every ${{ }} below is a matrix value or a workflow
# identifier, never event-controlled text, and none is interpolated into a
# `run:` script — the values reach the shell through `env:` instead.
on:
  pull_request: { branches: ['**'] }
  push: { branches: ['1.x'] }

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (Drupal ${{ matrix.drupal }}, PHP ${{ matrix.php }})${{ matrix.database != 'sqlite' && format(' [{0}]', matrix.database) || '' }}
    runs-on: ubuntu-latest
    strategy:
      # Report every combination: a failure on one core version is a real
      # result, not a reason to hide the others.
      fail-fast: false
      matrix:
        include:
          - drupal: '10.6'
            constraint: '~10.6.0'
            php: '8.3'
            phpunit: '^9.6'
            database: sqlite
            connection: 'sqlite://localhost/:memory:'
          - drupal: '11.3'
            constraint: '~11.3.0'
            php: '8.3'
            phpunit: '^11.5'
            database: sqlite
            connection: 'sqlite://localhost/:memory:'
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'
            database: sqlite
            connection: 'sqlite://localhost/:memory:'

          # Cross-process append serialization needs a server database. SQLite
          # in-memory cannot share a mutex across processes, so those tests
          # skip there. One PostgreSQL and one MySQL leg on the current major
          # is enough to run them without multiplying the Drupal-version matrix.
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'
            database: postgres
            connection: 'pgsql://drupal:drupal@127.0.0.1/drupal_test'
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'
            database: mysql
            connection: 'mysql://drupal:drupal@127.0.0.1/drupal_test'

    # Empty image: the runner skips the container. Both services used to
    # start on every leg, including in-memory SQLite, which is the waste
    # this split exists to stop. Health options stay empty then too —
    # a liveness check on a skipped service can still fail the job.
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: drupal_test
          POSTGRES_USER: drupal
          POSTGRES_PASSWORD: drupal
        ports:
          - 5432:5432
        options: ${{ matrix.database == 'postgres' && '--health-cmd "pg_isready -U drupal -d drupal_test" --health-interval 5s --health-timeout 5s --health-retries 10' || '' }}
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_DATABASE: drupal_test
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal_root
        ports:
          - 3306:3306
        options: ${{ matrix.database == 'mysql' && '--health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdrupal_root --silent" --health-interval 5s --health-timeout 5s --health-retries 10' || '' }}

    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite/sqlite3: the kernel-test database. gd: pulled in by
          # core's test bootstrap.
          extensions: gd, pdo_sqlite, sqlite3, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          # Install the working copy, not a released package.
          composer config repositories.audit_chain path ../module

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
          PHPUNIT_VERSION: ${{ matrix.phpunit }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # -W on both: recommended-project ships a lock file, so each require
          # is a partial update and composer refuses to move the transitive
          # packages core-dev needs.
          retry composer require -W --no-interaction --no-progress "drupal/audit_chain:*@dev"
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_VERSION}" \
            "drush/drush:^13"

      - name: Assert the versions actually under test
        working-directory: drupal
        env:
          EXPECTED_DRUPAL: ${{ matrix.drupal }}
        run: |
          set -euo pipefail
          # Require the autoloader inline: php ignores auto_prepend_file for -r
          # code, so loading it any other way leaves InstalledVersions undefined
          # and the line fatals after printing its label.
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Drupal core: ${core}"
          vendor/bin/phpunit --version

          # Assert, do not merely print. A leg named for a floor that silently
          # resolved the ceiling is covered by nothing while looking green.
          case "${core}" in
            "${EXPECTED_DRUPAL}".*) ;;
            *) echo "::error::Leg claims Drupal ${EXPECTED_DRUPAL} but resolved ${core}. Fix matrix.constraint rather than this check."; exit 1 ;;
          esac

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          # A path repo can silently fall back to a registry package; if that
          # happened the suite would pass against code nobody changed.
          test -L web/modules/contrib/audit_chain \
            || { echo "::error::audit_chain is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/audit_chain

      - name: PHPUnit — Unit (blocking)
        working-directory: drupal
        env:
          SIMPLETEST_DB: ${{ matrix.connection }}
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          MIN_UNIT_TESTS: '16'
        run: |
          set -euo pipefail
          config="${PWD}/web/core/phpunit.xml.dist"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Unit.xml" \
            "${PWD}/web/modules/contrib/audit_chain/tests/src/Unit"

          total="$(grep -ho '<testcase ' junit-Unit.xml | wc -l | tr -d ' ')"
          echo "Collected ${total} unit tests (floor ${MIN_UNIT_TESTS})."
          if [ "${total}" -lt "${MIN_UNIT_TESTS}" ]; then
            echo "::error::Collected only ${total} unit tests, below the floor of ${MIN_UNIT_TESTS}."
            exit 1
          fi

      - name: PHPUnit — Kernel (blocking)
        working-directory: drupal
        env:
          # Matrix value, not a YAML literal: sqlite's DSN ends in a colon,
          # which a quoted mapping value in this file would misparse.
          SIMPLETEST_DB: ${{ matrix.connection }}
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # Floor is the last counted collection; a runner that drops
          # tests must fail.
          MIN_TESTS: '210'
        run: |
          set -euo pipefail
          # Absolute -c path: AuditChainLoggerTest and RecoverySegmentsTest
          # declare @runTestsInSeparateProcesses (they spawn append-worker.php
          # or mutate the DB connection), and a child process does not inherit
          # this working directory. PHPUnit 9.6 passes a relative path straight
          # through, so every child dies on "Could not read phpunit.xml.dist".
          config="${PWD}/web/core/phpunit.xml.dist"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Kernel.xml" \
            "${PWD}/web/modules/contrib/audit_chain/tests/src/Kernel"

          # Assert the count, not just the exit status: an exit code only says
          # the tests that ran passed, never which ran. A runner that collects
          # nothing exits 0.
          total="$(grep -ho '<testcase ' junit-Kernel.xml | wc -l | tr -d ' ')"
          echo "Collected ${total} tests (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} tests, below the floor of ${MIN_TESTS}. The suite was dropped, not fixed."
            exit 1
          fi

      - name: Installed Drush recovery lifecycle (blocking)
        working-directory: drupal
        env:
          AUDIT_CHAIN_CLI_TEST: '1'
        run: bash web/modules/contrib/audit_chain/tests/scripts/recovery-cli.sh

      # The optional audit_chain_mcp submodule (#3624446) needs Tool API and MCP
      # Sentinel. They are installed only now, after the base suite and the CLI
      # lifecycle have run against a fixture that holds the base module alone,
      # so the base module is still proven to need neither. Both packages
      # support every core version this matrix runs, so every leg runs this.
      - name: Install Tool API and MCP Sentinel
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # MCP Sentinel requires drupal/audit_chain ^1.0.1. A path repo takes
          # its version from the checkout, which here is a detached commit and
          # satisfies no release constraint. Name the version, so the working
          # copy stays the package under test.
          composer config repositories.audit_chain --json \
            '{"type":"path","url":"../module","options":{"versions":{"drupal/audit_chain":"1.x-dev"}}}'
          retry composer require -W --no-interaction --no-progress \
            'drupal/audit_chain:1.x-dev' \
            'drupal/mcp_sentinel:^2.22' \
            'drupal/tool:^1.0.0-beta8'
          composer show --no-ansi drupal/mcp_sentinel | sed -n '1,4p'
          composer show --no-ansi drupal/tool | sed -n '1,4p'
          test -L web/modules/contrib/audit_chain \
            || { echo "::error::audit_chain is no longer symlinked to the working copy - MCP Sentinel pulled in a released copy"; exit 1; }

      - name: PHPUnit — audit_chain_mcp Kernel (blocking)
        working-directory: drupal
        env:
          SIMPLETEST_DB: ${{ matrix.connection }}
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          MIN_MCP_TESTS: '12'
        run: |
          set -euo pipefail
          config="${PWD}/web/core/phpunit.xml.dist"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Mcp.xml" \
            "${PWD}/web/modules/contrib/audit_chain/modules/audit_chain_mcp/tests/src/Kernel"

          # Count the tests that ran. The suite skips itself when Tool API or
          # MCP Sentinel is missing, and a skipped test is still a <testcase>,
          # so counting elements alone would pass a run that tested nothing.
          ran="$(php -r '
            $xml = simplexml_load_file($argv[1]);
            $ran = 0;
            foreach ($xml->xpath("//testcase") as $case) {
              if (!isset($case->skipped)) {
                $ran++;
              }
            }
            echo $ran;
          ' junit-Mcp.xml)"
          echo "Ran ${ran} audit_chain_mcp tests (floor ${MIN_MCP_TESTS})."
          if [ "${ran}" -lt "${MIN_MCP_TESTS}" ]; then
            echo "::error::Only ${ran} audit_chain_mcp tests ran, below the floor of ${MIN_MCP_TESTS}."
            exit 1
          fi

  # DEV-1010: prove RFC 3161 and the witness suite against PHP openssl
  # backed by the OpenSSL 3 FIPS provider. continue-on-error is
  # intentionally absent. SQLite is enough: these tests do not need a
  # server database.
  phpunit-openssl-fips:
    name: PHPUnit (OpenSSL 3 FIPS provider)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3, openssl
          coverage: none

      - name: Cache the OpenSSL 3 FIPS prefix
        uses: actions/cache@v4
        with:
          path: ~/openssl-fips
          key: openssl-3.0.16-fips-${{ runner.os }}

      - name: Build OpenSSL 3 with the FIPS provider
        run: bash module/tests/scripts/setup-openssl-fips.sh

      - name: Guard — FIPS provider must be the default
        run: php module/tests/scripts/assert-openssl-fips.php

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: '~11.3.0'
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.audit_chain path ../module

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: '~11.3.0'
          PHPUNIT_VERSION: '^11.5'
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          retry composer require -W --no-interaction --no-progress "drupal/audit_chain:*@dev"
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_VERSION}" \
            "drush/drush:^13"

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/audit_chain \
            || { echo "::error::audit_chain is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/audit_chain

      - name: PHPUnit — RFC 3161 and witness suite (blocking)
        working-directory: drupal
        env:
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # Floor is the last counted collection; a runner that drops
          # tests must fail.
          MIN_TESTS: '45'
        run: |
          set -euo pipefail
          # Re-run the guard in this step so a later env leak cannot
          # silently test against the distro OpenSSL.
          php ../module/tests/scripts/assert-openssl-fips.php
          config="${PWD}/web/core/phpunit.xml.dist"
          module="${PWD}/web/modules/contrib/audit_chain"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Fips.xml" \
            "${module}/tests/src/Kernel/Rfc3161WitnessBackendTest.php" \
            "${module}/tests/src/Kernel/WitnessBackendsTest.php" \
            "${module}/tests/src/Kernel/WitnessDemoTest.php" \
            "${module}/tests/src/Unit"

          total="$(grep -ho '<testcase ' junit-Fips.xml | wc -l | tr -d ' ')"
          echo "Collected ${total} tests (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} tests, below the floor of ${MIN_TESTS}. The FIPS suite was dropped, not fixed."
            exit 1
          fi

  phpcs:
    name: Drupal coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHPCS + the Drupal standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer drupal/coder

      - name: phpcs
        working-directory: module
        run: |
          # The module's own phpcs.xml.dist, not a standard spelled out here.
          # This job used to pass --standard=Drupal,DrupalPractice with its own
          # --extensions list, so the committed ruleset and the enforced one
          # could drift apart invisibly: editing phpcs.xml.dist changed what a
          # developer runs locally and nothing about what CI checked. The
          # drupalcode phpcs job reads the file, so this now asks the same
          # question rather than a similar one.
          ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist -p

  # d.o cspell is allow_failure and GitHub had no cspell job, so the
  # unknown words from #94/#95/#98/#99 shipped in 1.13.0. This job uses
  # gitlab_templates' prepare-cspell.php and the cspell binary plus
  # dictionaries from Drupal core's yarn.lock, the same way d.o does.
  cspell:
    name: CSpell
    runs-on: ubuntu-latest
    env:
      # Bump GITLAB_TEMPLATES_SHA when prepare-cspell.php or
      # assets/.cspell.json changes. Bump DRUPAL_CORE_REF when the
      # current-major tag d.o installs ships a new cspell or dictionary.
      GITLAB_TEMPLATES_SHA: '6cc044b819ba1bea9da3d1fa1e7575fcb0368888'
      DRUPAL_CORE_REF: '11.4.11'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Fetch pinned gitlab_templates cspell prep and Drupal core
        run: |
          set -euo pipefail
          mkdir -p web/core/misc/cspell
          templates="https://git.drupalcode.org/project/gitlab_templates/-/raw/${GITLAB_TEMPLATES_SHA}"
          core="https://git.drupalcode.org/project/drupal/-/raw/${DRUPAL_CORE_REF}/core"
          curl -fsSL "${templates}/assets/.cspell.json" -o .cspell.json
          curl -fsSL "${templates}/scripts/prepare-cspell.php" -o prepare-cspell.php
          curl -fsSL "${core}/package.json" -o web/core/package.json
          curl -fsSL "${core}/yarn.lock" -o web/core/yarn.lock
          curl -fsSL "${core}/.yarnrc.yml" -o web/core/.yarnrc.yml
          curl -fsSL "${core}/misc/cspell/dictionary.txt" \
            -o web/core/misc/cspell/dictionary.txt
          curl -fsSL "${core}/misc/cspell/drupal-dictionary.txt" \
            -o web/core/misc/cspell/drupal-dictionary.txt
          test -s .cspell.json
          test -s prepare-cspell.php
          test -s web/core/package.json
          test -s web/core/yarn.lock
          test -s web/core/.yarnrc.yml
          test -s web/core/misc/cspell/dictionary.txt
          test -s web/core/misc/cspell/drupal-dictionary.txt

      - name: Cache core node_modules
        uses: actions/cache@v4
        with:
          path: web/core/node_modules
          key: cspell-core-${{ env.DRUPAL_CORE_REF }}-${{ runner.os }}

      - name: Install cspell from core's yarn.lock
        working-directory: web/core
        run: |
          set -euo pipefail
          corepack enable
          yarn --version
          yarn install --immutable

      - name: cspell
        env:
          _WEB_ROOT: web
          _CSPELL_DICTIONARY: .cspell-project-words.txt
          _CSPELL_IGNORE_STANDARD_FILES: '1'
          CI_PROJECT_NAME: audit_chain
        run: |
          set -euo pipefail
          cspell=web/core/node_modules/.bin/cspell
          echo "cspell $($cspell --version)"
          echo "@cspell/dict-software-terms $(node -p "require('./web/core/node_modules/@cspell/dict-software-terms/package.json').version")"
          echo "@cspell/cspell-bundled-dicts $(node -p "require('./web/core/node_modules/@cspell/cspell-bundled-dicts/package.json').version")"
          php prepare-cspell.php
          # Same as d.o include.drupalci.main.yml: do not spell-check the
          # fetched helper.
          rm -f prepare-cspell.php
          "$cspell" -c .cspell.json --show-suggestions --show-context --no-progress .

  # GitHub analyzes the optional MCP tools. Drupal.org prefers phpstan.neon,
  # which excludes modules/audit_chain_mcp because that composer install does
  # not have drupal/tool or drupal/mcp_sentinel. This job installs both and
  # must stay on phpstan.neon.dist.
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      # phpstan-drupal needs a real Drupal tree to resolve core classes, so
      # this scaffolds the same way the PHPUnit job does. Analysing the
      # module on its own reports hundreds of "class not found" errors and
      # tells you nothing about the module.
      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:^11" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          # MCP Sentinel requires drupal/audit_chain ^1.0.1. A path repo takes
          # its version from the checkout, which here is a detached commit and
          # satisfies no release constraint. Name the version, so the working
          # copy stays the package under test.
          composer config repositories.audit_chain --json \
            '{"type":"path","url":"../module","options":{"versions":{"drupal/audit_chain":"1.x-dev"}}}'

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          retry composer require -W --no-interaction --no-progress \
            'drupal/audit_chain:1.x-dev'
          # phpstan-drupal plus the optional MCP submodule's runtime
          # neighbours: a missing one turns a real error into a
          # "class not found" that hides it.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:^11" \
            "phpstan/phpstan:^2" \
            "phpstan/extension-installer:^1.4" \
            "mglaman/phpstan-drupal:^2" \
            "phpstan/phpstan-deprecation-rules:^2" \
            "drush/drush:^13" \
            "drupal/mcp_sentinel:^2.22" \
            "drupal/tool:^1.0.0-beta8"

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/audit_chain \
            || { echo "::error::audit_chain is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/audit_chain

      - name: phpstan
        working-directory: drupal
        run: |
          set -euo pipefail
          # Must stay on phpstan.neon.dist. See the job comment above.
          vendor/bin/phpstan analyze web/modules/contrib/audit_chain \
            -c web/modules/contrib/audit_chain/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G

  # d.o previous-major phpstan is allow_failure and GitHub only ran ^11, so
  # the RequirementSeverity return-type miss on 10.6 shipped in 1.13.0. This
  # uses phpstan.neon (the file d.o prefers) and the phpstan 1.x that
  # core-dev ~10.6.0 ships. MCP tools stay out: d.o does not install them
  # and phpstan.neon excludes that subtree.
  phpstan-previous-major:
    name: PHPStan (Drupal 10.6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # d.o previous-major uses CORE_PREVIOUS_PHP_MIN (8.1 on 10.6).
          php-version: '8.1'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:~10.6.0" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.audit_chain path ../module

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          retry composer require -W --no-interaction --no-progress \
            'drupal/audit_chain:*@dev'
          # core-dev ~10.6.0 brings phpstan ^1.12 and phpstan-drupal ^1.2,
          # which is what d.o previous-major analyses with. Drush is
          # unconstrained, as gitlab_templates require-drush does; on
          # PHP 8.1 that resolves to 12.x (13.x needs 8.3).
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:~10.6.0" \
            "drush/drush"

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/audit_chain \
            || { echo "::error::audit_chain is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/audit_chain
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Drupal core: ${core}"
          case "${core}" in
            10.6.*) ;;
            *) echo "::error::Previous-major phpstan claims Drupal 10.6 but resolved ${core}."; exit 1 ;;
          esac

      - name: phpstan
        working-directory: drupal
        run: |
          set -euo pipefail
          vendor/bin/phpstan --version
          # phpstan.neon, not phpstan.neon.dist: d.o prefers this file and
          # it excludes audit_chain_mcp, which this job does not install.
          vendor/bin/phpstan analyze web/modules/contrib/audit_chain \
            -c web/modules/contrib/audit_chain/phpstan.neon \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G
