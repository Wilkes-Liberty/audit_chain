services:
  logger.channel.audit_chain:
    parent: logger.channel_base
    arguments:
      - 'audit_chain'

  audit_chain.logger:
    class: Drupal\audit_chain\AuditChainLogger
    arguments:
      - '@database'
      - '@current_user'
      - '@request_stack'
      - '@config.factory'
      - '@datetime.time'
      - '@key.repository'
      - '@logger.channel.audit_chain'
      - '@encryption'
      - '@entity_type.manager'
      - '@state'

  # Request-scoped buffer for consumers that would otherwise log per access
  # check. Deduplicates and writes once at kernel.terminate — see the README
  # section "Writing to the chain".
  audit_chain.collector:
    class: Drupal\audit_chain\AuditChainCollector
    arguments:
      - '@audit_chain.logger'

  audit_chain.recovery:
    class: Drupal\audit_chain\RecoverySegments
    arguments:
      - '@database'
      - '@audit_chain.logger'
      - '@datetime.time'
      - '@state'
      - '@extension.list.module'

  audit_chain.flush_subscriber:
    class: Drupal\audit_chain\EventSubscriber\AuditChainFlushSubscriber
    arguments:
      - '@audit_chain.collector'
    tags:
      - { name: event_subscriber }

  audit_chain.scheduled_verifier:
    class: Drupal\audit_chain\ScheduledVerifier
    arguments:
      - '@config.factory'
      - '@audit_chain.logger'
      - '@state'
      - '@datetime.time'
      - '@event_dispatcher'
      - '@logger.channel.audit_chain'
      - '@key.repository'
      - '@audit_chain.recovery'

  audit_chain.evidence_exporter:
    class: Drupal\audit_chain\EvidenceExporter
    arguments:
      - '@database'
      - '@state'
      - '@datetime.time'
      - '@http_client'
      - '@logger.channel.audit_chain'

  audit_chain.archive_bundle_exporter:
    class: Drupal\audit_chain\ArchiveBundleExporter
    arguments:
      - '@database'
      - '@audit_chain.logger'
      - '@audit_chain.recovery'
      - '@datetime.time'

  audit_chain.witness_backend.null:
    class: Drupal\audit_chain\NullWitnessBackend
    arguments:
      - '@uuid'
    tags:
      - { name: audit_chain.witness_backend }

  audit_chain.witness_manager:
    class: Drupal\audit_chain\WitnessManager
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
    tags:
      - { name: service_collector, tag: audit_chain.witness_backend, call: addBackend }

  audit_chain.metrics:
    class: Drupal\audit_chain\AuditChainMetrics
    arguments:
      - '@database'
      - '@datetime.time'
      - '@state'
      - '@config.factory'
      - '@logger.channel.audit_chain'

  audit_chain.chart_renderer:
    class: Drupal\audit_chain\AuditChainChartRenderer
    arguments:
      - '@module_handler'
      - '@?plugin.manager.charts'

  Drupal\audit_chain\AuditChainLoggerInterface: '@audit_chain.logger'
  Drupal\audit_chain\AuditChainCollector: '@audit_chain.collector'
