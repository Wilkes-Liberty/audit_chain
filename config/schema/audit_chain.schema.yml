audit_chain.settings:
  type: config_object
  label: 'Audit Chain settings'
  mapping:
    hash_key:
      type: string
      label: 'HMAC signing key — Key entity ID (empty = unkeyed SHA-256)'
    previous_hash_keys:
      type: sequence
      label: 'Retired signing keys still accepted when verifying older rows'
      sequence:
        type: string
        label: 'Key entity ID'
    encryption_profile:
      type: string
      label: 'Encryption profile for metadata at rest — Encryption Profile entity ID'
    stream_enabled:
      type: boolean
      label: 'Emit each entry to the audit_chain logger channel (SIEM streaming)'
    verify_interval:
      type: integer
      label: 'Scheduled verification interval in seconds (0 = disabled)'
    verify_require_keyed:
      type: boolean
      label: 'Assurance profile: refuse unkeyed verification and unkeyed history'
    export_enabled:
      type: boolean
      label: 'Push new chain rows to the export destination on cron'
    export_destination:
      type: string
      label: 'Evidence export destination — http(s) ingest URL or file path'
    export_channel:
      type: string
      label: 'Restrict the cron export to one channel (empty = all channels)'
    witness_backend:
      type: string
      label: 'Witness backend service identifier (empty = fail-closed NoOp backend)'
    witness_opentimestamps:
      type: mapping
      label: 'OpenTimestamps witness'
      mapping:
        calendars:
          type: sequence
          label: 'Calendar submit URLs'
          sequence:
            type: string
            label: 'Calendar URL'
        upgrade_allowlist:
          type: sequence
          label: 'Calendar origins accepted inside proofs'
          sequence:
            type: string
            label: 'Calendar origin'
        header_url:
          type: string
          label: 'Bitcoin header API base URL'
        min_depth:
          type: integer
          label: 'Minimum Bitcoin confirmations before a receipt is final'
    witness_xrpl:
      type: mapping
      label: 'XRPL witness client'
      mapping:
        relay_url:
          type: string
          label: 'Witness relay URL'
        read_url:
          type: string
          label: 'Read-only transaction URL'
        network:
          type: string
          label: 'XRPL network (testnet or devnet)'
        sink_address:
          type: string
          label: 'Dedicated witness sink account'
        witness_account:
          type: string
          label: 'Dedicated witness account'
